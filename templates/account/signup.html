{% extends "base.html" %}
{% load i18n %}
{% block title %}회원가입{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>회원가입</h1>
  <p class="text-muted">가입 후 이메일 인증 링크를 보냅니다. 인증을 마쳐야 로그인할 수 있습니다.</p>
  <form method="post" action="{% url 'account_signup' %}">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">가입하기</button>
  </form>
  <p class="text-muted" style="margin-top:1rem">
    이미 계정이 있으신가요? <a href="{% url 'account_login' %}">로그인</a>
  </p>
  <h3 class="social-login-heading">소셜 로그인</h3>
  {% include "account/includes/social_login_buttons.html" %}
</div>
{% endblock %}
