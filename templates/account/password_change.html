{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block page_header %}
<header class="page-header">
  <h1>비밀번호 변경</h1>
  <div class="page-actions">
    <a href="{% url 'account_email' %}" class="btn btn-secondary">이메일 관리로</a>
  </div>
</header>
{% endblock %}
{% block content %}
<div class="card" style="max-width:28rem">
  <form method="post" action="{% url 'account_change_password' %}">
    {% csrf_token %}
    {{ redirect_field }}
    {{ form.as_p }}
    <p><button type="submit" class="btn">비밀번호 변경</button></p>
  </form>
  <p class="text-muted"><a href="{% url 'account_reset_password' %}">비밀번호를 잊으셨나요?</a></p>
</div>
{% endblock %}
