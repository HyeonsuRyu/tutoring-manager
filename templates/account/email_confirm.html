{% extends "base.html" %}
{% block title %}이메일 인증{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;margin:2rem auto">
  {% if confirmation %}
  <h1>이메일 인증</h1>
  <p>{{ confirmation.email_address.email }} 주소를 인증하시겠습니까?</p>
  <form method="post" action="{% url 'account_confirm_email' confirmation.key %}">{% csrf_token %}
    <button type="submit" class="btn">인증 완료</button>
  </form>
  {% else %}
  <h1>링크가 올바르지 않습니다</h1>
  <p class="text-muted">인증 링크가 만료되었거나 이미 사용되었을 수 있습니다.</p>
  <p><a href="{% url 'account_login' %}" class="btn">로그인</a></p>
  {% endif %}
</div>
{% endblock %}
