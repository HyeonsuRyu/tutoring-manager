{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="card auth-card">
  <h1>로그인</h1>
  <form method="post" action="{% url 'account_login' %}">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">로그인</button>
  </form>
  <p class="text-muted" style="margin-top:1rem">
    계정이 없으신가요? <a href="{% url 'account_signup' %}"><strong>회원가입</strong></a>
  </p>
  <h3 class="social-login-heading">소셜 로그인</h3>
  {% include "account/includes/social_login_buttons.html" %}
</div>
{% endblock %}
