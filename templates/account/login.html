{% extends "base.html" %}
{% load socialaccount %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:2rem auto">
  <h1>로그인</h1>
  <form method="post" action="{% url 'account_login' %}">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">로그인</button>
  </form>
  <p class="text-muted" style="margin-top:1rem">
    계정이 없으신가요? <a href="{% url 'account_signup' %}"><strong>회원가입</strong></a><br>
    <a href="{% url 'account_reset_password' %}">비밀번호 찾기</a>
  </p>
  <h3>소셜 로그인</h3>
  <p>
    <a class="btn btn-secondary" href="{% provider_login_url 'google' %}">Google</a>
    <a class="btn btn-secondary" href="{% provider_login_url 'github' %}">GitHub</a>
    <a class="btn btn-secondary" href="{% provider_login_url 'naver' %}">네이버</a>
  </p>
</div>
{% endblock %}
