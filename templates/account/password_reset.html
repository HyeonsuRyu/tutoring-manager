{% extends "base.html" %}
{% block title %}비밀번호 찾기{% endblock %}
{% block content %}
<div class="card" style="max-width:420px;margin:2rem auto">
  <h1>비밀번호 찾기</h1>
  <p class="text-muted">가입한 이메일 주소를 입력하면 재설정 링크를 보냅니다.</p>
  <form method="post" action="{% url 'account_reset_password' %}">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">메일 보내기</button>
  </form>
  <p class="text-muted" style="margin-top:1rem"><a href="{% url 'account_login' %}">로그인</a></p>
</div>
{% endblock %}
