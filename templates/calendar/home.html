{% extends "base.html" %}
{% block title %}홈 달력{% endblock %}
{% block extra_head %}
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
<style>
  #event-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100; align-items:center; justify-content:center; }
  #event-modal.open { display:flex; }
  #event-modal .inner { background:#fff; padding:1.25rem; border-radius:8px; max-width:480px; width:90%; max-height:90vh; overflow:auto; }
  .fc-event-proposed { opacity:.55; border:2px dashed #6b7280 !important; }
  .fc-event-conflict { box-shadow: inset 0 0 0 2px #dc2626 !important; }
  .fc-event-upcoming { background: #3b82f6 !important; border-color: #3b82f6 !important; }
  .fc-event-in_progress { background: #f59e0b !important; border-color: #f59e0b !important; }
  .fc-event-past_incomplete { background: #ef4444 !important; border-color: #ef4444 !important; }
  .fc-event-completed { background: #22c55e !important; border-color: #22c55e !important; }
  .fc-event-cancelled { background: #9ca3af !important; border-color: #9ca3af !important; text-decoration: line-through; }
  .proposal-actions {
    display: none;
    position: fixed;
    z-index: 200;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 4px;
    gap: 4px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
    pointer-events: auto;
  }
  .proposal-actions.visible { display: flex; }
  /* 일(빨강)·토(파랑) — 헤더·날짜 숫자 */
  .fc .fc-col-header .fc-day-sun .fc-col-header-cell-cushion,
  .fc .fc-daygrid-day.fc-day-sun .fc-daygrid-day-number,
  .fc .fc-timegrid-axis-frame + table .fc-day-sun .fc-col-header-cell-cushion,
  .fc .fc-timegrid-col.fc-day-sun .fc-col-header-cell-cushion { color: #dc2626; font-weight: 600; }
  .fc .fc-col-header .fc-day-sat .fc-col-header-cell-cushion,
  .fc .fc-daygrid-day.fc-day-sat .fc-daygrid-day-number,
  .fc .fc-timegrid-col.fc-day-sat .fc-col-header-cell-cushion { color: #2563eb; font-weight: 600; }
  /* 주차 — 월요일 칸: 주차(왼쪽)·날짜(오른쪽) 한 줄 */
  .fc .fc-day-mon .fc-daygrid-day-top.fc-day-top-with-week {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: .25rem;
    width: 100%;
    padding: 2px 4px;
  }
  .fc .fc-day-mon .fc-daygrid-day-top.fc-day-top-with-week .fc-daygrid-day-number {
    float: none;
    margin-left: auto;
  }
  .fc .fc-week-number-monday {
    display: inline-block;
    flex: 0 0 auto;
    color: #4b5563;
    font-size: .7rem;
    font-weight: 600;
    line-height: 1.3;
    text-align: left;
    background: color-mix(in srgb, #e8eaed 80%, #111827 20%);
    padding: 1px 5px;
    border-radius: 4px;
  }

</style>
{% endblock %}
{% block page_header %}
<header class="page-header">
  <h1>홈 달력</h1>
  <div class="page-actions toolbar-row" style="margin-bottom:0">
    <span class="text-muted">요일 시작</span>
    <div class="segmented" role="group" aria-label="요일 시작">
      <input type="radio" class="segmented-input" name="week-start" id="week-start-0" value="0" checked>
      <label class="segmented-btn" for="week-start-0">일~토</label>
      <input type="radio" class="segmented-input" name="week-start" id="week-start-1" value="1">
      <label class="segmented-btn" for="week-start-1">월~일</label>
    </div>
  </div>
</header>
{% endblock %}
{% block content %}
<div class="card">
  <div id="calendar"></div>
</div>
<div id="event-modal">
  <div class="inner">
    <h3 id="modal-title"></h3>
    <p id="modal-sub" class="text-muted"></p>
    <div id="modal-lesson-fields" style="display:none">
      <label>수업 내용<textarea id="modal-content" rows="3" style="max-width:100%"></textarea></label>
      <label>비고<textarea id="modal-notes" rows="2" style="max-width:100%"></textarea></label>
      <p><button type="button" class="btn" id="modal-save-notes">내용·비고 저장</button></p>
    </div>
    <div id="modal-cancel-form" style="display:none">
      <h4>수업 취소</h4>
      <label>주체
        <select id="cancel-by"><option value="student">학생</option><option value="teacher">교사</option></select>
      </label>
      <label>사유<input id="cancel-reason" style="max-width:100%"></label>
      <label>보강
        <select id="cancel-makeup"><option value="undecided">미정</option><option value="no_makeup">없음</option><option value="scheduled">예정</option></select>
      </label>
      <label>보강일<input type="date" id="cancel-makeup-date"></label>
      <p><button type="button" class="btn btn-secondary" id="modal-cancel-lesson">취소 처리</button></p>
    </div>
    <div id="modal-actions"></div>
    <p style="margin-top:1rem">
      <a id="modal-student-link" href="#" class="btn btn-secondary">학생 상세</a>
      <button type="button" class="btn btn-secondary" onclick="closeModal()">닫기</button>
    </p>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
const UI_COLORS = {
  proposed: '#9ca3af', upcoming: '#3b82f6', in_progress: '#f59e0b',
  past_incomplete: '#ef4444', completed: '#22c55e', cancelled: '#9ca3af'
};
function getCookie(n) {
  const v = document.cookie.match('(^|;) ?' + n + '=([^;]*)(;|$)');
  return v ? v[2] : null;
}
function postForm(url, data) {
  const body = new URLSearchParams(data);
  return fetch(url, {
    method: 'POST',
    headers: {'X-CSRFToken': getCookie('csrftoken'), 'Content-Type': 'application/x-www-form-urlencoded'},
    credentials: 'same-origin',
    body
  }).then(r => r.json());
}
function patchLesson(id, payload) {
  return fetch('/api/v1/lessons/' + id + '/', {
    method: 'PATCH',
    headers: {'X-CSRFToken': getCookie('csrftoken'), 'Content-Type': 'application/json'},
    credentials: 'same-origin',
    body: JSON.stringify(payload)
  }).then(function(res) {
    if (!res.ok) {
      return res.json().then(function(body) {
        throw new Error(body.detail || '수업 일정 저장에 실패했습니다.');
      }, function() {
        throw new Error('수업 일정 저장에 실패했습니다.');
      });
    }
    return res.json();
  });
}
function closeModal() { document.getElementById('event-modal').classList.remove('open'); }
let currentEvent = null;
let calendar;
let hoverBar = null;
let hoverEvent = null;
let hoverHideTimer = null;

function ensureHoverBar() {
  if (hoverBar) return hoverBar;
  hoverBar = document.createElement('div');
  hoverBar.id = 'proposal-hover';
  hoverBar.className = 'proposal-actions';
  hoverBar.innerHTML =
    '<button type="button" class="btn" id="hover-approve" title="수업 일자 확인">✓</button>' +
    '<button type="button" class="btn btn-secondary" id="hover-dismiss" title="취소">✗</button>';
  document.body.appendChild(hoverBar);
  hoverBar.addEventListener('mouseenter', function() {
    if (hoverHideTimer) clearTimeout(hoverHideTimer);
  });
  hoverBar.addEventListener('mouseleave', function() {
    hoverBar.classList.remove('visible');
    hoverEvent = null;
  });
  return hoverBar;
}

function positionHoverBarNearEvent(eventEl) {
  const bar = ensureHoverBar();
  const pad = 8;
  bar.classList.add('visible');
  bar.style.visibility = 'hidden';
  bar.style.left = '0';
  bar.style.top = '0';
  const barRect = bar.getBoundingClientRect();
  bar.style.visibility = '';
  const eventRect = eventEl.getBoundingClientRect();
  let left = eventRect.right + pad;
  let top = eventRect.top + (eventRect.height - barRect.height) / 2;
  if (left + barRect.width > window.innerWidth - pad) {
    left = eventRect.left - barRect.width - pad;
  }
  top = Math.max(pad, Math.min(top, window.innerHeight - barRect.height - pad));
  bar.style.left = Math.max(pad, left) + 'px';
  bar.style.top = top + 'px';
}

function showProposalHover(fcEvent, eventEl) {
  const bar = ensureHoverBar();
  hoverEvent = fcEvent;
  if (hoverHideTimer) clearTimeout(hoverHideTimer);
  positionHoverBarNearEvent(eventEl);
}

function hideProposalHoverSoon() {
  if (hoverHideTimer) clearTimeout(hoverHideTimer);
  hoverHideTimer = setTimeout(function() {
    if (!hoverBar || hoverBar.matches(':hover')) return;
    hoverBar.classList.remove('visible');
    hoverEvent = null;
  }, 350);
}

function isHoverBarTarget(node) {
  return hoverBar && node && (node === hoverBar || hoverBar.contains(node));
}

function eventTitle(e) {
  const base = e.title || e.student_name;
  const sub = e.subtitle ? '\n' + e.subtitle : '';
  const bang = e.has_conflict ? ' ‼' : '';
  return base + bang + sub;
}

const WEEK_START_KEY = 'calendarWeekStart';

function calendarDayClasses(date) {
  const dow = date.getDay();
  if (dow === 0) return ['fc-day-sun'];
  if (dow === 6) return ['fc-day-sat'];
  return [];
}

function getIsoWeek(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function clearMondayWeekNumber(container) {
  if (!container || !container.classList.contains('fc-daygrid-day-top')) return;
  container.classList.remove('fc-day-top-with-week');
  container.querySelectorAll('.fc-week-number-monday').forEach(function(el) { el.remove(); });
}

function attachMondayWeekNumber(container, date) {
  if (!container || date.getDay() !== 1) return;
  container.classList.add('fc-day-top-with-week');
  const el = document.createElement('span');
  el.className = 'fc-week-number-monday';
  el.textContent = getIsoWeek(date) + '주';
  const dayNum = container.querySelector('.fc-daygrid-day-number');
  if (dayNum) {
    container.insertBefore(el, dayNum);
  } else {
    container.appendChild(el);
  }
}

function getWeekStartPreference() {
  const v = localStorage.getItem(WEEK_START_KEY);
  return v === '1' ? 1 : 0;
}

function applyWeekStartPreference(firstDay) {
  localStorage.setItem(WEEK_START_KEY, String(firstDay));
  document.querySelectorAll('input[name="week-start"]').forEach(function(radio) {
    radio.checked = radio.value === String(firstDay);
  });
  if (calendar) calendar.setOption('firstDay', firstDay);
}

function openModal(e) {
  currentEvent = e;
  document.getElementById('modal-title').textContent = (e.title || e.student_name) + (e.has_conflict ? ' ‼' : '');
  document.getElementById('modal-sub').textContent = e.subtitle || '';
  document.getElementById('modal-student-link').href = '/students/' + e.student_id + '/';
  const fields = document.getElementById('modal-lesson-fields');
  const cancelForm = document.getElementById('modal-cancel-form');
  const actions = document.getElementById('modal-actions');
  actions.innerHTML = '';
  fields.style.display = 'none';
  cancelForm.style.display = 'none';

  if (e.type === 'lesson' && e.id.startsWith('lesson-')) {
    const lid = e.id.replace('lesson-', '');
    fields.style.display = 'block';
    document.getElementById('modal-content').value = e.lesson_content || '';
    document.getElementById('modal-notes').value = e.lesson_notes || '';
    document.getElementById('modal-save-notes').onclick = () => {
      patchLesson(lid, {
        lesson_content: document.getElementById('modal-content').value,
        lesson_notes: document.getElementById('modal-notes').value
      }).then(() => { closeModal(); calendar.refetchEvents(); });
    };
    if (e.status !== 'completed' && e.status !== 'cancelled') {
      const complete = document.createElement('button');
      complete.className = 'btn'; complete.textContent = '완료';
      complete.onclick = () => postForm('/calendar/lessons/' + lid + '/complete/', {})
        .then(() => { closeModal(); calendar.refetchEvents(); });
      actions.append(complete);
      cancelForm.style.display = 'block';
      document.getElementById('modal-cancel-lesson').onclick = () => {
        const data = {
          cancelled_by: document.getElementById('cancel-by').value,
          cancel_reason: document.getElementById('cancel-reason').value,
          makeup_status: document.getElementById('cancel-makeup').value,
        };
        const md = document.getElementById('cancel-makeup-date').value;
        if (md) data.makeup_date = md;
        postForm('/calendar/lessons/' + lid + '/cancel/', data)
          .then(() => { closeModal(); calendar.refetchEvents(); });
      };
    }
  } else if (e.proposed && e.schedule_slot_id) {
    const approve = document.createElement('button');
    approve.className = 'btn'; approve.textContent = '✓ 승인';
    approve.onclick = () => postForm('{% url "lesson-approve-web" %}', {schedule_slot_id: e.schedule_slot_id, date: e.date})
      .then(() => { closeModal(); calendar.refetchEvents(); });
    const dismiss = document.createElement('button');
    dismiss.className = 'btn btn-secondary'; dismiss.textContent = '✗ 거절';
    dismiss.onclick = () => postForm('{% url "proposal-dismiss-web" %}', {schedule_slot_id: e.schedule_slot_id, date: e.date})
      .then(() => { closeModal(); calendar.refetchEvents(); });
    actions.append(approve, document.createTextNode(' '), dismiss);
  }
  document.getElementById('event-modal').classList.add('open');
}

document.addEventListener('DOMContentLoaded', function() {
  const calEl = document.getElementById('calendar');
  const weekStart = getWeekStartPreference();
  applyWeekStartPreference(weekStart);
  document.querySelectorAll('input[name="week-start"]').forEach(function(radio) {
    radio.addEventListener('change', function() {
      if (!this.checked) return;
      applyWeekStartPreference(parseInt(this.value, 10));
    });
  });
  ensureHoverBar();
  document.getElementById('hover-approve').onclick = () => {
    if (!hoverEvent) return;
    const e = hoverEvent.extendedProps;
    postForm('{% url "lesson-approve-web" %}', {schedule_slot_id: e.schedule_slot_id, date: e.date})
      .then(() => { hoverBar.classList.remove('visible'); calendar.refetchEvents(); });
  };
  document.getElementById('hover-dismiss').onclick = () => {
    if (!hoverEvent) return;
    const e = hoverEvent.extendedProps;
    postForm('{% url "proposal-dismiss-web" %}', {schedule_slot_id: e.schedule_slot_id, date: e.date})
      .then(() => { hoverBar.classList.remove('visible'); calendar.refetchEvents(); });
  };
  window.addEventListener('scroll', hideProposalHoverSoon, true);
  window.addEventListener('resize', hideProposalHoverSoon);

  calendar = new FullCalendar.Calendar(calEl, {
    initialView: 'dayGridMonth',
    headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek' },
    locale: 'ko',
    firstDay: weekStart,
    dayHeaderClassNames: function(arg) { return calendarDayClasses(arg.date); },
    dayCellClassNames: function(arg) { return calendarDayClasses(arg.date); },
    dayCellDidMount: function(arg) {
      const top = arg.el.querySelector('.fc-daygrid-day-top');
      clearMondayWeekNumber(top);
      attachMondayWeekNumber(top, arg.date);
    },
    dayCellDidUnmount: function(arg) {
      clearMondayWeekNumber(arg.el.querySelector('.fc-daygrid-day-top'));
    },
    editable: true,
    eventDisplay: 'block',
    events: function(info, success, failure) {
      fetch('{% url "calendar-events-json" %}?start=' + info.startStr.slice(0,10) + '&end=' + info.endStr.slice(0,10) + '&_=' + Date.now(), {credentials: 'same-origin', cache: 'no-store'})
        .then(r => r.json())
        .then(data => {
          success(data.events.map(e => ({
            id: e.id,
            title: (e.title || e.student_name) + (e.has_conflict ? ' ‼' : ''),
            start: e.start,
            end: e.end,
            classNames: [
              e.proposed ? 'fc-event-proposed' : 'fc-event-' + e.ui_state,
              e.has_conflict ? 'fc-event-conflict' : ''
            ].filter(Boolean),
            backgroundColor: e.proposed ? UI_COLORS.proposed : (UI_COLORS[e.ui_state] || '#3b82f6'),
            editable: !e.proposed && e.status !== 'completed' && e.status !== 'cancelled',
            extendedProps: e,
          })));
        }).catch(failure);
    },
    eventDidMount: function(arg) {
      if (arg.event.extendedProps.proposed) {
        arg.el.addEventListener('mouseenter', function() {
          showProposalHover(arg.event, arg.el);
        });
        arg.el.addEventListener('mouseleave', function(ev) {
          if (isHoverBarTarget(ev.relatedTarget)) return;
          hideProposalHoverSoon();
        });
      }
      if (arg.event.extendedProps.subtitle) {
        const sub = document.createElement('div');
        sub.className = 'fc-event-sub';
        sub.style.fontSize = '0.75em';
        sub.textContent = arg.event.extendedProps.subtitle;
        const titleEl = arg.el.querySelector('.fc-event-title');
        if (titleEl && !titleEl.querySelector('.fc-event-sub')) titleEl.appendChild(sub);
      }
    },
    eventClick: function(arg) {
      const e = arg.event.extendedProps;
      if (e.proposed) return;
      arg.jsEvent.preventDefault();
      let url = '/students/' + e.student_id + '/';
      if (e.id && e.id.startsWith('lesson-')) {
        url += '?lesson=' + e.id.replace('lesson-', '');
      }
      window.location.href = url;
    },
    eventDrop: function(arg) {
      const e = arg.event.extendedProps;
      if (e.proposed || e.status === 'completed' || e.status === 'cancelled') { arg.revert(); return; }
      const lid = e.id.replace('lesson-', '');
      const end = arg.event.end || new Date(arg.event.start.getTime() + (e.duration_minutes || 60) * 60000);
      patchLesson(lid, {start_datetime: arg.event.start.toISOString(), end_datetime: end.toISOString()})
        .then(function() { calendar.refetchEvents(); })
        .catch(function(err) { alert(err.message); arg.revert(); });
    },
    eventResize: function(arg) {
      const e = arg.event.extendedProps;
      if (e.status === 'completed' || e.status === 'cancelled') { arg.revert(); return; }
      const lid = e.id.replace('lesson-', '');
      const end = arg.event.end || new Date(arg.event.start.getTime() + (e.duration_minutes || 60) * 60000);
      patchLesson(lid, {start_datetime: arg.event.start.toISOString(), end_datetime: end.toISOString()})
        .then(function() { calendar.refetchEvents(); })
        .catch(function(err) { alert(err.message); arg.revert(); });
    },
  });
  calendar.render();
});
</script>
{% endblock %}
