{% extends "base.html" %}
{% block title %}진도차트 데이터 불러오기{% endblock %}
{% block page_header %}
<header class="page-header">
  <div>
    <h1>진도차트 데이터 불러오기</h1>
    <p class="text-muted page-header-sub">진도차트.xls 파일을 업로드한 뒤 내용을 검토하고 적용합니다.</p>
  </div>
  <div class="page-actions">
    <a href="{% url 'progress-hub' %}" class="btn btn-secondary">진도차트로</a>
  </div>
</header>
{% endblock %}
{% block content %}
<div class="card" style="max-width:32rem">
  <p class="text-muted">
    <a href="{% url 'progress-import-template' %}">진도차트.xls 템플릿</a> 형식의 파일만 지원합니다.
    모든 수업은 <strong>완료</strong> 상태로 등록됩니다.
  </p>
  <form method="post" enctype="multipart/form-data" class="auth-form">
    {% csrf_token %}
    <label for="file">엑셀 파일</label>
    <input type="file" id="file" name="file" accept=".xls,.xlsx" required>
    <p class="form-submit-row"><button type="submit" class="btn">업로드 후 검토</button></p>
  </form>
</div>
{% endblock %}
