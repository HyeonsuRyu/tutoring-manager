services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    env_file:
      - .env
    environment:
      DB_BACKEND: ${DB_BACKEND:?}
      DB_HOST: ${DB_HOST:?}
      DB_PORT: ${DB_PORT:?}
      DB_NAME: ${DB_NAME:?}
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      SECRET_KEY: ${SECRET_KEY:?}
      DEBUG: ${DEBUG:-False}
      DOMAIN: ${DOMAIN:-local}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
    volumes:
      - ../data/media:/app/data/media
      - ../data/static:/app/data/static
    networks:
      - app

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_BIND:-127.0.0.1:8080}:80"
    environment:
      DOMAIN_NAME: ${DOMAIN:-localhost}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../data/static:/app/staticfiles:ro
      - ../data/media:/app/media:ro
    depends_on:
      - web
    networks:
      - app

  postgres:
    profiles: ["embedded"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app

networks:
  app:
    driver: bridge
