services:
  app:
    build:
      context: ../backend
    container_name: tutoring-manager-app
    environment:
      APP_NAME: ${APP_NAME:-Tutoring Manager}
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to external Postgres}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost"]}
      MAIL_FROM: ${MAIL_FROM:-noreply@localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: /data/uploads
    volumes:
      - app_uploads:/data/uploads
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped

  web:
    build:
      context: ../frontend
    container_name: tutoring-manager-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app_uploads:
