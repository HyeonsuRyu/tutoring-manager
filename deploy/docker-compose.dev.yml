# Dev-only extras. Do not use in production.
# Usage:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml up --build

services:
  app:
    environment:
      APP_ENV: development
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USE_TLS: "false"
      MAIL_FROM: noreply@localhost
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: tutoring-manager-mailpit
    ports:
      - "8025:8025" # UI
      - "1025:1025" # SMTP
    restart: unless-stopped
