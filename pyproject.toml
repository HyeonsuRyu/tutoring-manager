[project]
name = "tutoring-manager"
version = "0.1.0"
description = "과외 관리 (tutoring-manager)"
readme = "tests/README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0,<6",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-allauth>=65.0",
    "cryptography>=42.0",
    "django-anymail[resend]>=12.0",
    "django-axes>=7.0",
    "django-otp>=1.5",
    "argon2-cffi>=23.0",
    "gunicorn>=22.0",
    "psycopg[binary]>=3.1",
    "qrcode>=7.4",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "xlwt>=1.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: pure logic, no database (run first)",
    "integration: ORM and service layer with database",
    "api: HTTP API tests (run after integration services pass)",
]

[tool.coverage.run]
source = ["accounts", "students", "calendar_app", "reports", "api", "core"]
